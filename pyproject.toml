[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "local-ai-knowledge-assistant"
version = "0.1.0"
description = "A multilingual, locally hosted AI knowledge assistant using RAG."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
authors = [
    { name = "Chris Fofou" }
]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]",
    "pydantic>=2",
    "pypdf>=6",
    "sentence-transformers>=6",
    "chromadb>=1",
    "httpx>=0.28",
    "python-multipart"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "reportlab>=5"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
